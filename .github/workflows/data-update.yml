name: Update admission data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run data:update

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- docs/data public/data; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data public/data
          git commit -m "Update admission data"
          git push origin HEAD:main

      - name: Publish the static site
        run: |
          git subtree split --prefix docs -b pages-artifact
          git push --force origin pages-artifact:gh-pages
